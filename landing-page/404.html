<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Placedon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Playfair Display";
    src: url("fonts/PlayfairDisplay-Variable.ttf") format("truetype");
    font-weight: 400 900;
    font-style: normal;
  }

  :root {
    --ink:       #0A0A0A;
    --parchment: #F5F3EF;
    --slate:     #475569;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--ink);
    color: var(--parchment);
    font-size: 16px;
    font-weight: 300;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 0 48px;
    height: 60px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .logo {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--parchment);
    text-decoration: none;
    letter-spacing: -0.01em;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 560px;
    margin: 0 auto;
    padding: 80px 48px 100px;
  }

  .code {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .code::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 1px;
    background: currentColor;
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 56px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--parchment);
    margin-bottom: 24px;
  }

  p {
    font-size: 15px;
    font-weight: 300;
    line-height: 1.8;
    color: rgba(245,243,239,0.45);
    max-width: 400px;
    margin-bottom: 52px;
  }

  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-size: 17px;
    color: var(--parchment);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 3px;
    transition: border-color 150ms ease;
  }
  .home-link:hover { border-color: var(--parchment); }
  .home-link .arr { font-style: normal; font-size: 13px; color: rgba(255,255,255,0.3); }

  footer {
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 28px 48px;
    flex-shrink: 0;
  }
  .foot-note {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.12);
  }

  @media (max-width: 600px) {
    nav    { padding: 0 24px; }
    main   { padding: 60px 24px 80px; }
    h1     { font-size: 38px; }
    footer { padding: 24px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Placedon</a>
</nav>

<main>
  <div class="code">404 &nbsp;·&nbsp; Not found</div>
  <h1>Nothing here.</h1>
  <p>
    The page you're looking for doesn't exist — or was moved.
    Placedon abstains on questions it can't answer. Same applies here.
  </p>
  <a href="index.html" class="home-link">Back to Placedon <span class="arr">↗</span></a>
</main>

<footer>
  <div class="foot-note">© 2026 Placedon &nbsp;·&nbsp; Not legal advice.</div>
</footer>

</body>
</html>
